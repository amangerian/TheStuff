<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alex Mangerian — Projects</title>
<meta name="description" content="Projects by Alex Mangerian.">
<meta name="theme-color" content="#0e1116">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230e1116'/><circle cx='10' cy='11' r='3' fill='%237dd3fc'/><circle cx='22' cy='9' r='2.4' fill='%23a78bfa'/><circle cx='16' cy='22' r='2.8' fill='%235eead4'/><g stroke='%2394a3b8' stroke-width='1.4' opacity='.8'><line x1='10' y1='11' x2='22' y2='9'/><line x1='10' y1='11' x2='16' y2='22'/><line x1='22' y1='9' x2='16' y2='22'/></g></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e1116; --card:#151a22; --hover:#1a202a; --line:#232a36;
  --text:#e8edf5; --dim:#8a97ab;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f6f7f9; --card:#fff; --hover:#fff; --line:#e1e5ec; --text:#141a22; --dim:#66738a; }
}
body{
  font-family:var(--sans); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:clamp(48px, 12vh, 120px) 16px 48px;
}
main{width:100%; max-width:760px}
h1{font-size:1.25rem; font-weight:600; letter-spacing:-.01em}
h1 span{color:var(--dim); font-weight:400}

.grid{
  list-style:none; margin-top:28px;
  display:grid; gap:12px; grid-template-columns:repeat(2, minmax(0,1fr));
}
.grid a{
  display:flex; align-items:center; gap:14px;
  padding:14px 16px; border-radius:14px;
  background:var(--card); border:1px solid var(--line);
  color:inherit; text-decoration:none;
  transition:transform .18s ease, border-color .18s, background .18s;
}
.grid a:hover, .grid a:focus-visible{
  transform:translateY(-2px); background:var(--hover);
  border-color:color-mix(in srgb, var(--c) 55%, var(--line));
  outline:none;
}
.glyph{
  flex:none; width:42px; height:42px; border-radius:11px;
  display:grid; place-items:center; color:var(--c);
  background:color-mix(in srgb, var(--c) 14%, transparent);
}
.glyph svg{width:23px; height:23px}
@media (prefers-color-scheme: light){
  .glyph{color:color-mix(in srgb, var(--c) 62%, #000); background:color-mix(in srgb, var(--c) 22%, transparent)}
}
.name{font-weight:600; font-size:15px; line-height:1.3}
.what{color:var(--dim); font-size:13px; line-height:1.35; margin-top:2px}
.arrow{margin-left:auto; color:var(--dim); transition:transform .18s, color .18s}
.grid a:hover .arrow{transform:translateX(3px); color:var(--c)}

footer{margin-top:36px; font-size:12.5px}
footer a{color:var(--dim); text-decoration:none}
footer a:hover{color:var(--text)}

@media (max-width:560px){ .grid{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<main>
  <h1>Alex Mangerian <span>· Projects</span></h1>
  <ul class="grid" id="grid"></ul>
  <footer><a href="https://github.com/amangerian" rel="noopener">github.com/amangerian</a></footer>
</main>

<script>
/* ==========================================================================
   SITE REGISTRY START
   One object per site. To add one, append an object — nothing else changes.
   icon: network | feed | board | dashboard | paw | breath
   ========================================================================== */
const SITES = [
  { title: 'NeuroNet Atlas',    what: '3D brain network atlas',    url: 'https://amangerian.github.io/neuronet-atlas/', icon: 'network',   color: '#7dd3fc' },
  { title: 'Your Journal',      what: 'Personalized research feed', url: 'https://amangerian.github.io/yourjournal/',    icon: 'feed',      color: '#a78bfa' },
  { title: 'Board Study Games', what: 'Jeopardy & review games',    url: 'https://amangerian.github.io/MPboardstudy/',   icon: 'board',     color: '#fbbf24' },
  { title: 'MedBoard Prep',     what: 'Board study dashboard',      url: 'https://amangerian.github.io/med-board/',      icon: 'dashboard', color: '#5eead4' },
  { title: '3D Zoo',            what: 'Zoo tycoon game',            url: 'https://amangerian.github.io/3DZoo/',          icon: 'paw',       color: '#86efac' },
  { title: 'CPAP Maintenance',  what: 'CPAP upkeep tracker',        url: 'https://amangerian.github.io/CPAPMaintain/',   icon: 'breath',    color: '#f9a8d4' }
];
/* SITE REGISTRY END */

const ICONS = {
  network: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6.6 8.2 17 5.6M6.6 8.2l4.9 9.4M17 5.6l-5.5 12" opacity=".55"/><circle cx="6.6" cy="8.2" r="2.6" fill="currentColor" stroke="none"/><circle cx="17" cy="5.6" r="2" fill="currentColor" stroke="none" opacity=".7"/><circle cx="11.5" cy="17.6" r="2.3" fill="currentColor" stroke="none" opacity=".85"/></svg>',
  feed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.2" y="4.4" width="17.6" height="15.2" rx="2.6" opacity=".55"/><path d="M6.6 8.6h7.2M6.6 12h10.8M6.6 15.4h6"/><circle cx="17.4" cy="8.6" r="1.7" fill="currentColor" stroke="none"/></svg>',
  board: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2.4" opacity=".55"/><path d="M9 4v16M15 4v16M3 9.4h18M3 14.8h18" opacity=".45"/><rect x="9.9" y="10.3" width="4.2" height="3.6" rx="1" fill="currentColor" stroke="none"/></svg>',
  dashboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 19.4V13M9.3 19.4V7.6M14.6 19.4v-4.2M19.9 19.4V4.6"/><path d="M3 19.4h18" opacity=".4"/></svg>',
  paw: '<svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="16.2" rx="4.6" ry="3.8"/><ellipse cx="5.6" cy="11.2" rx="1.9" ry="2.4" opacity=".8"/><ellipse cx="18.4" cy="11.2" rx="1.9" ry="2.4" opacity=".8"/><ellipse cx="9" cy="6.6" rx="1.9" ry="2.5" opacity=".8"/><ellipse cx="15" cy="6.6" rx="1.9" ry="2.5" opacity=".8"/></svg>',
  breath: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4.4 9.2c1.9-2.4 4.2-2.4 6.1 0s4.2 2.4 6.1 0" opacity=".5"/><path d="M4.4 13.4c1.9-2.4 4.2-2.4 6.1 0s4.2 2.4 6.1 0"/><path d="M4.4 17.6c1.9-2.4 4.2-2.4 6.1 0s4.2 2.4 6.1 0" opacity=".5"/></svg>'
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('grid').innerHTML = SITES.map(s => `
  <li><a href="${esc(s.url)}" rel="noopener" style="--c:${esc(s.color)}">
    <span class="glyph" aria-hidden="true">${ICONS[s.icon] || ICONS.network}</span>
    <span><span class="name">${esc(s.title)}</span><span class="what" style="display:block">${esc(s.what)}</span></span>
    <span class="arrow" aria-hidden="true">&rarr;</span>
  </a></li>`).join('');
</script>
</body>
</html>
